version: '3.8'

services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - XIAOMI_API_KEY=${XIAOMI_API_KEY}
      - MEM0_API_KEY=${MEM0_API_KEY}
      - JARVIS_MODEL=mimo-v2.5
      - JARVIS_PORT=3030
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped

  whispera:
    build:
      context: ../whispera
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    environment:
      - ASR_MODE=cloud
      - TTS_MODE=cloud
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jarvis
      - whispera
    restart: unless-stopped